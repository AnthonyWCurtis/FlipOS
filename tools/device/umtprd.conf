# FlipOS uMTP-Responder configuration
loop_on_disconnect 1
umask 022

# One deliberately narrow MTP storage. flip-usb-mtp bind-mounts only the
# user-serviceable content into this root.
storage "/mnt/SDCARD/flipos-dev/mtp-root" "FlipOS" "rw"

manufacturer "FlipOS Project"
product "FlipOS"
serial "MiyooFlip"
firmware_version "Beta 1"
mtp_extensions "microsoft.com: 1.0; android.com: 1.0;"
interface "MTP"
perceived_device_type 0x0
battery_capacity "/sys/class/power_supply/battery/capacity"

# These values are reported through MTP device information. The composite USB
# gadget itself keeps the board's existing Rockchip VID/PID so ADB remains
# available on development units.
usb_vendor_id 0x2207
usb_product_id 0x0006
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x0311

sync_when_close 0x1
usb_functionfs_mode 0x1
usb_dev_path "/dev/ffs-mtp/ep0"
usb_epin_path "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
