name: UX Prototype Checks

on:
  push:
    branches:
      - ux/console-home-v1
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  ux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      # This runs before the release modules are downloaded: it proves
      # development verification works on a fresh checkout by itself.
      - name: Verify clean checkout (54 host checks and ARM64 builds)
        run: |
          set -euo pipefail
          test ! -e build/flip_opp_voltage.ko
          test ! -e build/flip_opp_runtime_profile.ko
          test ! -e build/flip_tsadc_recovery.ko
          test ! -e build/flip_rk817_charger.ko
          if ! make verify; then
            cat /tmp/flipos-verify.log
            exit 1
          fi

      - name: Build release userspace
        run: |
          make \
            charge-service mtp-responder \
            optimizer-supervisor-tool \
            optimizer-deadman-tool \
            optimizer-guard-tool \
            optimizer-calibration-tool \
            optimizer-candidate-tool \
            optimizer-session-tool \
            optimizer-progress-tool \
            optimizer-validation-progress-tool \
            optimizer-runtime-tool

      - name: Restore verified legacy kernel modules for package dry run
        run: |
          set -euo pipefail
          mkdir -p /tmp/flipos-beta4 build
          curl -fL --retry 3 \
            "https://github.com/AnthonyWCurtis/FlipOS/releases/download/v0.1.0-beta.4/FlipOS-Update.tar.gz" \
            -o /tmp/flipos-beta4/update.tar.gz
          tar -xzf /tmp/flipos-beta4/update.tar.gz -C /tmp/flipos-beta4
          cd /tmp/flipos-beta4/FlipOSUpdate/payload/lib
          # Exact module bytes observed in the successful Beta 6.1 publish job.
          printf '%s\n' \
            'bceb39b3ece552a2fc81170a9f15bc5e1e181044e8b1a517318c61a5e2f2cf0a  flip_opp_voltage.ko' \
            'da6b696925b5f1eb7eef6335d7459ecde1286568b921ca1672e2e71ab438e79b  flip_opp_runtime_profile.ko' \
            '9dc4bb1965cd8eee8aeee0bceedb5d824a6e42d371c63e51131bb14e0f3a2d90  flip_tsadc_recovery.ko' \
            'ee2b58290d49a62602435086c39d28bbd9c4fb0145fa81034dab413780050bb4  flip_rk817_charger.ko' \
            | sha256sum --check --strict
          cp flip_opp_voltage.ko flip_opp_runtime_profile.ko \
            flip_tsadc_recovery.ko flip_rk817_charger.ko "$GITHUB_WORKSPACE/build/"

      - name: Dry-run current version packaging
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          make test-release-package
          rm -rf dist-ci
          tools/update/build-release-package "$VERSION" dist-ci
          tools/update/build-beta-install-bundle "$VERSION" dist-ci
          test -s dist-ci/FlipOS-Update.tar.gz
          test -s dist-ci/FlipOS-Fresh_Install.zip

      - name: Diff whitespace check
        run: git diff --check
