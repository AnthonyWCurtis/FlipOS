name: UX Prototype Checks

on:
  push:
    branches:
      - ux/console-home-v1
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  ux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      # Host-side regression targets from 'make verify'. Keep package/binary
      # production below; this check must not require a physical Miyoo Flip.
      - name: Full host-side regression tests
        run: |
          set -euo pipefail
          make \
            test-controls test-timing test-audio test-audio-queue test-audio-resampler test-paths \
            test-log test-battery test-power-policy test-charger test-wifi test-keyboard \
            test-setup test-update-installer test-update-fetch test-performance test-cpu-policy test-cpu-profile \
            test-cpu-dynamic test-optimizer test-optimizer-pmu-token test-optimizer-quiesce test-optimizer-panic-policy test-optimizer-guard \
            test-optimizer-supervisor test-optimizer-calibration test-optimizer-calibration-session test-bios test-settings test-osd \
            test-power test-library-cache test-exit-protocol test-lifecycle test-core test-core-host \
            test-video-layout test-gpu-protocol test-gpu-client test-state test-state-manager test-state-recovery-health \
            test-save test-save-manager test-recovery test-session-persistence test-session-registry test-session-adapter \
            test-game-stats test-system-registry test-session-save-safety test-perf-diag test-telemetry test-perf-capture-tools

      - name: Full architecture checks
        run: make test-architecture

      - name: Build frontend, game hosts and shared GPU service
        run: make frontend gb gba gpu-service

      - name: Build release userspace
        run: |
          make \
            charge-service mtp-responder \
            optimizer-supervisor-tool \
            optimizer-deadman-tool \
            optimizer-guard-tool \
            optimizer-calibration-tool \
            optimizer-candidate-tool \
            optimizer-session-tool \
            optimizer-progress-tool \
            optimizer-validation-progress-tool \
            optimizer-runtime-tool

      - name: Restore unchanged Beta 4 modules for package dry run
        run: |
          set -euo pipefail
          mkdir -p /tmp/flipos-beta4 build
          curl -fL --retry 3 \
            "https://github.com/AnthonyWCurtis/FlipOS/releases/download/v0.1.0-beta.4/FlipOS-Update.tar.gz" \
            -o /tmp/flipos-beta4/update.tar.gz
          tar -xzf /tmp/flipos-beta4/update.tar.gz -C /tmp/flipos-beta4
          cp /tmp/flipos-beta4/FlipOSUpdate/payload/lib/*.ko build/

      - name: Dry-run Beta 5 packaging
        run: |
          set -euo pipefail
          make test-release-package
          rm -rf dist-ci
          tools/update/build-release-package 0.1.0-beta.5 dist-ci
          tools/update/build-beta-install-bundle 0.1.0-beta.5 dist-ci
          test -s dist-ci/FlipOS-Update.tar.gz
          test -s dist-ci/FlipOS-Fresh_Install.zip

      - name: Diff whitespace check
        run: git diff --check
