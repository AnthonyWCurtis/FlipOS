name: UX Prototype Checks

on:
  push:
    branches:
      - ux/console-home-v1
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  ux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      - name: Shell and Python syntax checks
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' path; do
            IFS= read -r shebang < "$path" || :
            case "$shebang" in
              '#!/bin/sh') sh -n "$path" ;;
              '#!/usr/bin/env bash'|'#!/bin/bash') bash -n "$path" ;;
            esac
          done < <(find tools -type f -print0)
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/flipos-pycache" \
            python3 -m compileall -q tests tools

      # This runs before the release modules are downloaded: it proves
      # development verification works on a fresh checkout by itself.
      - name: Verify clean checkout (55 host checks and ARM64 builds)
        run: |
          set -euo pipefail
          test ! -e build/flip_opp_voltage.ko
          test ! -e build/flip_opp_runtime_profile.ko
          test ! -e build/flip_tsadc_recovery.ko
          test ! -e build/flip_rk817_charger.ko
          if ! make verify; then
            cat /tmp/flipos-verify.log
            exit 1
          fi

      - name: Build release userspace
        run: |
          make \
            charge-service mtp-responder \
            optimizer-supervisor-tool \
            optimizer-deadman-tool \
            optimizer-guard-tool \
            optimizer-calibration-tool \
            optimizer-candidate-tool \
            optimizer-session-tool \
            optimizer-progress-tool \
            optimizer-validation-progress-tool \
            optimizer-runtime-tool

      - name: Restore verified legacy kernel modules for package dry run
        run: |
          set -euo pipefail
          mkdir -p /tmp/flipos-beta4 build
          ARCHIVE=/tmp/flipos-beta4/update.tar.gz
          LOCK=tools/kernel/legacy-module-lock.json
          curl -fL --retry 3 \
            "https://github.com/AnthonyWCurtis/FlipOS/releases/download/v0.1.0-beta.4/FlipOS-Update.tar.gz" \
            -o "$ARCHIVE"
          # Pin the *complete* old release archive before giving it to tar.
          python3 tools/kernel/verify_release_module_inputs.py --lock "$LOCK" --archive "$ARCHIVE"
          # Extract only four known paths (never a whole untrusted release tree).
          for module in \
            flip_opp_voltage.ko \
            flip_opp_runtime_profile.ko \
            flip_tsadc_recovery.ko \
            flip_rk817_charger.ko; do
            tar -xOzf "$ARCHIVE" "FlipOSUpdate/payload/lib/$module" > "build/$module"
          done
          python3 tools/kernel/verify_release_module_inputs.py --lock "$LOCK" --modules build

      - name: Dry-run current version packaging
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          test -n "$VERSION"
          make test-release-package
          rm -rf dist-ci
          tools/update/build-release-package "$VERSION" dist-ci
          tools/update/build-beta-install-bundle "$VERSION" dist-ci
          test -s dist-ci/FlipOS-Update.tar.gz
          test -s dist-ci/FlipOS-Fresh_Install.zip

      - name: Diff whitespace check
        run: git diff --check
