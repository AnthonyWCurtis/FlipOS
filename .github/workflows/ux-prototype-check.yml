name: UX Prototype Checks

on:
  push:
    branches:
      - ux/console-home-v1
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  ux-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AArch64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross

      - name: Focused unit tests
        run: make test-game-stats test-controls test-power test-cpu-dynamic

      - name: UX architecture checks
        run: |
          python3 tests/test_play_stats_architecture.py
          python3 tests/test_frontend_ux_architecture.py
          python3 tests/test_home_layout_architecture.py
          python3 tests/test_gameswitcher_layout_architecture.py
          python3 tests/test_library_layout_architecture.py
          python3 tests/test_stats_details_layout_architecture.py
          python3 tests/test_settings_layout_architecture.py
          python3 tests/test_wifi_layout_architecture.py
          python3 tests/test_utility_layout_architecture.py
          python3 tests/test_time_layout_architecture.py
          python3 tests/test_first_boot_layout_architecture.py
          python3 tests/test_optimizer_layout_architecture.py
          python3 tests/test_quick_menu_layout_architecture.py
          python3 tests/test_play_options_layout_architecture.py
          python3 tests/test_power_menu_architecture.py
          python3 tests/test_power_architecture.py
          python3 tests/test_ui_scale_architecture.py
          python3 tests/test_settings_navigation_architecture.py
          python3 tests/test_session_adapter_architecture.py
          python3 tests/test_session_persistence_architecture.py

      - name: Build frontend and game hosts
        run: make frontend gb gba

      - name: Build release userspace
        run: |
          make \
            charge-service mtp-responder \
            optimizer-supervisor-tool \
            optimizer-deadman-tool \
            optimizer-guard-tool \
            optimizer-calibration-tool \
            optimizer-candidate-tool \
            optimizer-session-tool \
            optimizer-progress-tool \
            optimizer-validation-progress-tool \
            optimizer-runtime-tool

      - name: Restore unchanged Beta 4 modules for package dry run
        run: |
          set -euo pipefail
          mkdir -p /tmp/flipos-beta4 build
          curl -fL --retry 3 \
            "https://github.com/AnthonyWCurtis/FlipOS/releases/download/v0.1.0-beta.4/FlipOS-Update.tar.gz" \
            -o /tmp/flipos-beta4/update.tar.gz
          tar -xzf /tmp/flipos-beta4/update.tar.gz -C /tmp/flipos-beta4
          cp /tmp/flipos-beta4/FlipOSUpdate/payload/lib/*.ko build/

      - name: Dry-run Beta 5 packaging
        run: |
          set -euo pipefail
          make test-release-package
          rm -rf dist-ci
          tools/update/build-release-package 0.1.0-beta.5 dist-ci
          tools/update/build-beta-install-bundle 0.1.0-beta.5 dist-ci
          test -s dist-ci/FlipOS-Update.tar.gz
          test -s dist-ci/FlipOS-Fresh_Install.zip

      - name: Diff whitespace check
        run: git diff --check
